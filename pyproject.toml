[project]
name = "rubin-w3a8"
version = "0.1.0"
description = "CPU numerical reference for Rubin LUT-W3A8"
readme = "README.md"
authors = [
    { name = "Linsheng Yin", email = "linsheng@builtbyyin.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=3.5,<5",
    "numpy>=2.0,<3",
    "pytest>=8,<9",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
